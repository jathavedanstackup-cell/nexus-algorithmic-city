services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-algorithmic-city:local
    container_name: nexus-app
    ports:
      - "${NEXUS_PORT:-8000}:8000"
    environment:
      - NEXUS_ENV=${NEXUS_ENV:-production}
      - NEXUS_LOG_LEVEL=${NEXUS_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - nexus-benchmarks:/app/benchmarks/results

volumes:
  nexus-benchmarks:
